name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to package (for example, v0.1.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Release tag to package"
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Build Python distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Verify release version
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$version" = "$project_version" || {
            echo "Release tag $version does not match pyproject.toml version $project_version."
            exit 1
          }

      - name: Install test and build dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Build distributions
        run: python -m build --sdist --wheel

      - name: Verify wheel installation
        run: |
          python -m venv "$RUNNER_TEMP/hermes-home-release-smoke"
          "$RUNNER_TEMP/hermes-home-release-smoke/bin/pip" install --no-deps dist/*.whl
          "$RUNNER_TEMP/hermes-home-release-smoke/bin/python" -c \
            "from hermes_home import API_VERSION; assert API_VERSION == 1"

      - name: Ensure the GitHub release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes

      - name: Upload Python distributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz --clobber

      - name: Keep distributions for downstream jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error
