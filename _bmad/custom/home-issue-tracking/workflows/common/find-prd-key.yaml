# common/find-prd-key.yaml
#
# Purpose: Resolves prd_key from the configured branch first, then from prd.md
#           frontmatter WITHOUT switching to a PRD worktree. Silent (no prompts).
# Input variables: (none)
# Output variables:
#   - prd_key: the PRD key from the story/PRD branch or prd.md frontmatter
# Side effects: none

- RUN: git branch --show-current
  STORE: current_branch
- RUN: uv run --no-project python scripts/home_issue_tracking.py prd-key {current_branch}
  STORE: prd_key
- CHECK: exists prd_key
  TRUE:
    - STOP
  FALSE:
    - READ: {planning_artifacts}/prd.md
      EXTRACT:
        prd_key: frontmatter.prd_key
    - CHECK: exists prd_key
      TRUE:
        - STOP
      FALSE:
        - OUTPUT:
            message: "Could not determine prd_key from branch '{current_branch}' or {planning_artifacts}/prd.md frontmatter. Use the configured feat/{prd_key}/{story_key} branch pattern or add 'prd_key:' to the PRD frontmatter."
            stop: true
