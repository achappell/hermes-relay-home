# common/find-issue.yaml
#
# Purpose: Finds an issue by search text and returns its tracker ID.
#           Uses targeted search on both platforms (fixes GitHub fetch-all asymmetry).
# Input variables:
#   - search_text: text to search for in the issue (e.g. "{story_key}", "PRD: {prd_key}", "Epic {epic_num}:")
#   - prd_key: the PRD key (from scope, for label scoping)
#   - story_key: optional BMAD story key; Home resolves the exact issue URL from story-index.yaml first
# Output variables:
#   - issue_id: the issue IID (GitLab) or number (GitHub); empty string if not found
# Side effects: none

# Story issues use the checked-in URL first, then an exact sprint-key search.
# This finds older issues without dynamic labels and avoids duplicate creation.
- CHECK: exists story_key
  TRUE:
    - CHECK: platform eq "github"
      TRUE:
        - RUN: uv run --no-project python scripts/home_issue_tracking.py issue-id "{story_key}" "{host}" "{project}" "{platform}"
          STORE: indexed_issue_id
          PLATFORM: github
        - CHECK: empty indexed_issue_id
          FALSE:
            - SET: { variable: issue_id, value: "{indexed_issue_id}" }
            - STOP
        - RUN: gh api "search/issues?q=repo:{project}+{story_key}+is:issue&per_page=100" --hostname {host} | uv run --no-project python scripts/home_issue_tracking.py search-issue-id "{story_key}"
          STORE: matching_story_issue_id
          PLATFORM: github
        - CHECK: empty matching_story_issue_id
          FALSE:
            - SET: { variable: issue_id, value: "{matching_story_issue_id}" }
            - STOP
        # Do not fall through to a broad label search for a story. If no issue
        # carries its exact story key, issue creation is safer than guessing.
        - SET: { variable: issue_id, value: "" }
        - STOP

- RUN: glab api "projects/{project_enc}/issues?search={search_text}&labels=prd{sep}{prd_key}" --hostname {host} --paginate
  STORE: issue_result
  PLATFORM: gitlab
- RUN: gh api "search/issues?q={search_text}+repo:{project}+label:prd{sep}{prd_key}&per_page=100" --hostname {host} --paginate | uv run --no-project python -c "import json,sys; pages=sys.stdin.read().strip().split('\n'); items=[]; [items.extend(json.loads(p).get('items',[])) for p in pages if p]; print(json.dumps(items))"
  STORE: issue_result
  PLATFORM: github
- CHECK: empty issue_result
  TRUE:
    - SET: { variable: issue_id, value: "" }
  FALSE:
    - CHECK: platform eq "gitlab"
      TRUE:
        - FILTER:
            source: issue_result
            select: iid
            store: issue_id
      FALSE:
        - FILTER:
            source: issue_result
            select: number
            store: issue_id
