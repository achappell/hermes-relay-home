# common/get-mr-pipeline.yaml
#
# Purpose: Get the latest pipeline id + status for a given MR/PR.
# Input variables: mr_iid (numeric)
# Output variables:
#   - pipeline_id (string): gitlab pipeline id OR github workflow run id (unified name for cross-platform callers)
#   - pipeline_status (string): latest GitLab pipeline state or aggregate checks on the GitHub PR
# Side effects: none (read-only lookup)

# GitLab: fetch MR's latest pipeline (paginated, take first)
- RUN: glab api "projects/{project_enc}/merge_requests/{mr_iid}/pipelines" --hostname {host} --paginate | uv run --no-project python -c "
import json, sys
ps = json.load(sys.stdin)
if ps:
    print(str(ps[0]['id']))
else:
    print('')
"
  STORE: pipeline_id
  PLATFORM: gitlab

# GitLab: also fetch pipeline_status (separate RUN — multi-variable STORE has no precedent in this module; safer to split)
- RUN: glab api "projects/{project_enc}/merge_requests/{mr_iid}/pipelines" --hostname {host} --paginate | uv run --no-project python -c "
import json, sys
ps = json.load(sys.stdin)
print(ps[0]['status'] if ps else 'none')
"
  STORE: pipeline_status
  PLATFORM: gitlab

# GitHub: get the head SHA for this PR, then the matching pull_request workflow
# run only. This keeps diagnostics tied to this PR's current revision.
- RUN: gh pr view {mr_iid} -R "{mr_repo}" --json headRefOid --jq .headRefOid
  STORE: pr_head_sha
  PLATFORM: github
- RUN: gh run list --limit 1 --branch "{source_branch}" --event pull_request --commit "{pr_head_sha}" -R "{mr_repo}" --json databaseId | uv run --no-project python -c "
import json, sys
rs = json.load(sys.stdin)
print(str(rs[0]['databaseId']) if rs else '')
"
  STORE: pipeline_id
  PLATFORM: github

# GitHub: aggregate checks for this PR, including non-Actions required checks.
- RUN: |
    raw=$(gh pr checks {mr_iid} -R "{mr_repo}" --json bucket,state,name 2>/dev/null || true)
    echo "$raw" | uv run --no-project python -c "
import json, sys
try:
    checks = json.load(sys.stdin)
except json.JSONDecodeError:
    checks = []
buckets = [check.get('bucket', '') for check in checks]
if any(bucket in ('fail', 'cancel') for bucket in buckets):
    print('failure')
elif any(bucket == 'pending' for bucket in buckets):
    print('in_progress')
elif any(bucket == 'pass' for bucket in buckets) and all(
    bucket in ('pass', 'skipping') for bucket in buckets
):
    print('success')
else:
    print('none')
"
  STORE: pipeline_status
  PLATFORM: github
