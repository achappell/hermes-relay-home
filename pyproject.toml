[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-relay-home"
version = "0.2.0"
description = "Local Home service for canonical Hermes household state and wake arbitration"
readme = "README.md"
requires-python = ">=3.14,<3.15"
authors = [{ name = "Amanda Chappell" }]
dependencies = ["cryptography>=44", "websockets>=17,<18"]

[project.scripts]
hermes-home = "hermes_home.runtime:main"

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.23,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
